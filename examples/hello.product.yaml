# A product descriptor. This is the whole extension point of `rig`.
#
# A product is four things: what it needs, what to install, and three commands. `rig` never
# imports product code and never learns what a product does. It installs the packages, then
# calls `setup` and reads the JSON it prints.
#
# A second product is a second file exactly like this one.

version: 1
id: hello

# Capability ids from the site file. The product says "I need an npm registry". The site
# says which one. Neither names the other.
requires: [npm]

packages:
  - "@example/hello-cli"

commands:
  # Must accept --json and print {"ok": bool, "steps": [{"id","state","detail"}]}.
  setup: hello setup --json
  # Must never change the machine.
  doctor: hello doctor --json
  # Must undo what setup did, and nothing else.
  remove: hello setup --remove --json
